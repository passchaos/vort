name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Zig 0.16 local smoke spine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install optional CLI competitors
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake cabextract gzip libtool lz4 meson ninja-build p7zip-full squashfs-tools zstd libarchive-dev libbrotli-dev liblz4-dev liblzma-dev libsnappy-dev libssl-dev libzstd-dev zlib1g-dev git

      - name: Install pinned LZNT1 reference
        run: python3 -m pip install --break-system-packages lznt1==0.2

      - name: Install pinned XPRESS reference
        run: python3 -m pip install --break-system-packages xpress-lz77==1.0.1

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples bench tools

      - name: Build pinned Apple LZFSE reference CLI
        run: |
          lzfse_reference_dir=$(mktemp -d)
          git -C "$lzfse_reference_dir" init
          git -C "$lzfse_reference_dir" remote add origin https://github.com/lzfse/lzfse.git
          git -C "$lzfse_reference_dir" fetch --depth 1 origin e634ca58b4821d9f3d560cdc6df5dec02ffc93fd
          git -C "$lzfse_reference_dir" checkout --detach FETCH_HEAD
          make -C "$lzfse_reference_dir" -j2
          sudo install "$lzfse_reference_dir/build/bin/lzfse" /usr/local/bin/lzfse

      - name: Build pinned zchunk reference CLIs
        run: |
          zchunk_reference_dir=$(mktemp -d)
          git -C "$zchunk_reference_dir" init
          git -C "$zchunk_reference_dir" remote add origin https://github.com/zchunk/zchunk.git
          git -C "$zchunk_reference_dir" fetch --depth 1 origin 99e51afa38c723e7c25834c2c3b305d20ef55d04
          git -C "$zchunk_reference_dir" checkout --detach FETCH_HEAD
          meson setup "$zchunk_reference_dir/build" "$zchunk_reference_dir" -Dwith-curl=disabled -Dwith-openssl=enabled
          ninja -C "$zchunk_reference_dir/build"
          sudo meson install -C "$zchunk_reference_dir/build"
          sudo ldconfig

      - name: Build pinned erofs-utils reference CLIs
        run: |
          erofs_reference_dir=$(mktemp -d)
          git -C "$erofs_reference_dir" init
          git -C "$erofs_reference_dir" remote add origin https://github.com/erofs/erofs-utils.git
          git -C "$erofs_reference_dir" fetch --depth 1 origin 5fcb2f76f7b95df87f5c6d3a580e4d756ceaa1c8
          git -C "$erofs_reference_dir" checkout --detach FETCH_HEAD
          cd "$erofs_reference_dir"
          ./autogen.sh
          ./configure --without-uuid --without-libcurl --without-openssl --without-libxml2 --without-json-c
          make -j2
          sudo install mkfs/mkfs.erofs fsck/fsck.erofs dump/dump.erofs /usr/local/bin/

      - name: Run CI smoke aggregate
        run: zig build -Doptimize=ReleaseFast ci-smoke

      - name: Build zlib-rs compress example
        run: |
          mkdir -p "$HOME/Work"
          git clone --depth 1 https://github.com/trifectatechfoundation/zlib-rs "$HOME/Work/zlib-rs"
          cargo build --manifest-path "$HOME/Work/zlib-rs/Cargo.toml" --example compress

      - name: Run zlib-rs binary differential
        run: zig build -Doptimize=ReleaseFast run-zlib-family-diff

      - name: Run focused fuzz smoke entrypoints
        run: |
          zig build run-fuzz-smoke
          zig build run-fuzz-corpus
          zig build run-fuzz-target
          zig build run-libfuzzer-smoke
          zig build run-afl-smoke
